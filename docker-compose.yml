services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: milten_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=milten
      - DB_USER=root
      - DB_PASSWORD=password
      - NODE_ENV=production
      - JWT_SECRET=jwt_secret
      - JWT_EXPIRES_IN=1d
    depends_on:
      - db
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: milten_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: milten
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  db_data:
